services:
# ---- CONTENEDORES DE POSTGRES CON PRIMER REPLICA SET ----
  postgres_1:
    image: postgres:16
    container_name: postgres_1
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      REPLICA_USER: ${REPLICA_USER}
      REPLICA_PASSWORD: ${REPLICA_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10
      -c max_replication_slots=10 -c hot_standby_feedback=on -c
      wal_keep_size=128MB
    volumes:
      - postgres_1:/var_lib/postgtresql:z
      - ./scripts/init_postgres.sh:/docker-entrypoint-initdb.d/init_postgres.sh:z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # configuración de la replica 1
  postgres_2:
    image: postgres:16
    container_name: postgres_2
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICA_USER: ${REPLICA_USER}
      REPLICA_PASSWORD: ${REPLICA_PASSWORD}
    entrypoint: [ "bash", "/init_rep.sh" ]
    volumes:
      - postgres_2:/var/lib/postgresql:z
      - ./scripts/init_rep.sh:/init_rep.sh:z
    depends_on:
      - postgres_1
  # configuración de la replica 2
  postgres_3:
    image: postgres:16
    container_name: postgres_3
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICA_USER: ${REPLICA_USER}
      REPLICA_PASSWORD: ${REPLICA_PASSWORD}
    entrypoint: [ "bash", "/init_rep.sh" ]
    volumes:
      - postgres_3:/var/lib/postgresql:z
      - ./scripts/init_rep.sh:/init_rep.sh:z
    depends_on:
      - postgres_1

# ---- CONTENEDORES DE MONGO CON PRIMER REPLICA SET (Archivo Key File)----

  # PRIMER SERVICIO DE MONGO
  PinBoardMongo1:
    image: mongo:6.0
    container_name: PinBoardMongo1
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile
    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:z
      - ./PinBoardMongo1:/data/db:z
    ports:
      - "27017:27017"

  # SEGUNDO SERVICIO DE MONGO
  PinBoardMongo2:
    image: mongo:6.0
    container_name: PinBoardMongo2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile
    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:z
      - ./PinBoardMongo2:/data/db:z
    ports:
      - "27018:27017"

  # TERCER SERVICIO DE MONGO
  PinBoardMongo3:
    image: mongo:6.0
    container_name: PinBoardMongo3
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command: mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile
    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:z
      - ./PinBoardMongo3:/data/db:z
    ports:
      - "27019:27017"

# --- MICROSERVICIO 1 Y SU RÉPLICA ---
# Declaración del microservicio 1 tal cual como lo pusimos en nginx.conf
  microservicioAuth: &micro1_base
    image: node:18
    container_name: microservicioAuth
    working_dir: /app
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      URL_CONNECT: ${URL_CONNECT}
    volumes:
      - ./microservicioAuth:/app:z
    command: sh -c "npm install && npm start"
    depends_on:
      - postgres_1
      - postgres_2
      - postgres_3
    #expose:
    #  - "3000"
    ports:
      - "3000:3000"
  # --- RÉPLICA DEL MICROSERVICIO 1 ---
  microservicioAuth_replica:
    <<: *micro1_base # Copia toda la configuración de arriba
    container_name: microservicioAuth_replica
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      URL_CONNECT: ${URL_CONNECT}
      IS_REPLICA: "true"
    ports:
      - "3001:3000"

  # --- MICROSERVICIO 5 Y SU RÉPLICA ---
  image_service: &img_service_base
    image: python:3.9-slim
    container_name: image_service
    working_dir: /app
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MONGO_URI: ${MONGO_URI}
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
    volumes:
      - ./image_service:/app:z
      - image_service_uploads:/app/uploads:z
    command: sh -c "pip install --upgrade pip && pip install --no-cache-dir --default-timeout=100 -r requirements.txt && sleep 5&& echo 'Dependencias instaladas. Arrancando servidor...' && gunicorn --bind 0.0.0.0:3000 'app:create_app()'"
    depends_on:
      - PinBoardMongo1
      - PinBoardMongo2
      - PinBoardMongo3
    ports:
      - "3002:3000"
  # --- RÉPLICA DEL MICROSERVICIO 5 ---
  image_service_replica:
    <<: *img_service_base # Copia toda la configuración de arriba
    container_name: image_service_replica
    ports:
      - "3003:3000"
  # --- CONFIGURACIÓN DEL API GATEWAY ---
  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - microservicioAuth
      - microservicioAuth_replica
      - image_service
      - image_service_replica


volumes:
  image_service_uploads:
  postgres_1:
  postgres_2:
  postgres_3: